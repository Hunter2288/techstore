syntax = "proto3";

option csharp_namespace = "Orders.Grpc";
package orders;

service OrdersService {
  rpc GetOrder (GetOrderRequest) returns (OrderReply);
}

message GetOrderRequest { int64 id = 1; }
message OrderReply {
  int64 id = 1;
  int64 customer_id = 2;
  string status = 3;
  string total_amount = 4;
  string created_at = 5;
  repeated OrderItemReply items = 6;
}
message OrderItemReply {
  int64 product_id = 1;
  string product_name = 2;
  string unit_price = 3;
  int32 quantity = 4;
  string line_total = 5;
}
